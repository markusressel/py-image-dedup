# This is a reference configuration file explaining all the options
# of py-image-dedup.

py_image_dedup:
  # Configuration for the analysis phase, see README.md
  analysis:
    # Whether to search for duplicates across directories when
    # specifying more than one image source directory
    across_dirs: false
    # A filter for the file extensions to analyse
    file_extensions:
      - .png
      - .jpg
      - .jpeg
    # Whether to search recursively in each of the source directories
    recursive: true
    # A list of source directories to analyse
    source_directories:
      - /home/myuser/pictures/
    # A list of regex patterns to ignore when traversing any of the
    # source directories
    exclusions:
      - ".*/excluded/.*"
    # The number of threads to use for image analysis.
    # If unset, this will default to `os.cpu_count()`.
    threads: 1
    # Whether to include EXIF data of images in the analysis
    use_exif_data: true

  # Deduplication phase specific configuration options, see README.md
  deduplication:
    # The target directory to move duplicate images to
    duplicates_target_directory: /home/myuser/pictures/duplicates/
    # If enabled, duplicate groups whose best copy was only chosen by a weak
    # tie-breaker rule (e.g. file name or folder path length) are not
    # moved/deleted automatically, but wait for a decision in the web UI.
    hold_ambiguous_groups: false
    # Upper limit on the modification date difference between
    # two duplicate images to be considered the same image.
    max_file_modification_time_diff: 0:05:00
    # Specifies the criteria and their order for ordering the list of duplicates
    # to select the best copy.
    prioritization_rules:
      - name: "more-exif-data"
      - name: "less-exif-data"
      - name: "bigger-file-size"
      - name: "smaller-file-size"
      - name: "newer-file-modification-date"
      - name: "older-file-modification-date"
      - name: "smaller-distance"
      - name: "bigger-distance"
      - name: "longer-path"
      - name: "shorter-path"
      - name: "contains-copy-in-file-name"
      - name: "longer-file-name"
      - name: "shorter-file-name"
      - name: "longer-folder-path"
      - name: "shorter-folder-path"
      - name: "higher-score"
      - name: "lower-score"
      # path patterns (regular expressions) in priority order, see README.md
      - name: "preferred-paths"
        patterns: ["/Camera/"]
      - name: "avoided-paths"
        patterns: ["/Telegram "]
      # edited copies (file name/EXIF Software, patterns are optional) before their original
      - name: "prefer-edited"
        file_name_patterns: ["(?i)[-_ .(](edit|edited|bearbeitet)(\\W|_|$)"]
        software_patterns: ["(?i)lightroom|photoshop|snapseed"]
    # Files matching one of these regular expressions are never moved or deleted
    # (f.ex. curated albums). If the best copy is somewhere else, both are kept.
    protected_paths: []
    #  - "/Familie/"

  # Daemon specific configuration options, see README.md
  daemon:
    # Time for waiting on filesystems changes to settle before analysing.
    timeout: 30s
    # The type of file observer to use.
    # One of: polling, inotify
    file_observer: polling
  # A dry run can be used to validate the log output of a specific configuration
  # before actually deleting or removing any images in any of the source
  # directories.
  dry_run: true
  # Overrides dry_run for decisions made by the user (web UI, imported decisions).
  # F.ex. keep dry_run enabled and set this to false to only move the duplicates
  # you decided on. If not set, dry_run applies.
  # dry_run_user_decisions: false

  # Elasticsearch specific configuration options, see README.md
  elasticsearch:
    # Whether to automatically create an index in the target database.
    auto_create_index: true
    # Maximum time to wait for the elasticsearch backend to become reachable on startup.
    connection_timeout: 2m
    # Hostname of the elasticsearch backend instance to use
    host: 127.0.0.1
    # Port of the elasticsearch backend instance to use.
    port: 9200
    # The index name to use for storing and querying image analysis data.
    index: images
    # Maximum signature distance [0..1] to query from elasticsearch backend.
    max_distance: 0.1
  # Whether to remove empty folders or not.
  remove_empty_folders: false

  # Which matcher finds the duplicates, see README.md ("Matching backends")
  matching:
    # image-match: image-match + Elasticsearch (default, unchanged behaviour)
    # hashes: the hash pipeline (SHA-256, pixel hash, pHash/dHash), no Elasticsearch needed.
    #         Groups with variants (grayscale, colour-edited, crop), burst shots or a low
    #         confidence are always held for review.
    # both: image-match decides as before, the hash pipeline additionally runs on full runs
    #       and only records its groups (never acted on, not even by your decisions) to
    #       compare both in the web UI (/compare).
    backend: image-match
    # Where the hash pipeline stores its signatures: a SQLite file (default: signatures.db
    # next to state.database_path), sqlite:////absolute/path.db or
    # postgresql://user:password@host:5432/db (needs the "postgres" extra).
    # store_url: sqlite:////data/state/signatures.db
    # Maximum Hamming distance (of 64 bits) of pHash and dHash of two near-duplicates (both must hold)
    max_phash_distance: 10
    max_dhash_distance: 12
    # Files of the same camera taken at most this many seconds apart (but not at the same time)
    # are burst/series shots: they still match, with a lower confidence, and always go to review.
    burst_window_seconds: 10.0
    # Confidence subtracted from a match between burst shots
    burst_confidence_penalty: 0.3
    # Groups with a lower confidence (of their weakest match) are never acted on automatically
    auto_act_min_confidence: 0.8
    # Largest difference of a colour channel mean/standard deviation (0..255) that still counts
    # as the same colours, above it a match is a colour-edited variant (review)
    colour_edit_tolerance: 5.0
    # Relative aspect ratio difference above which a match is flagged as cropped
    aspect_ratio_tolerance: 0.02
    # Also match copies rotated/mirrored without an orientation tag (about 7x search time)
    match_rotations: true
    # Opt-in crop detection with SSCD embeddings (needs the "embeddings" extra, onnxruntime,
    # included in the Docker image). Crops and their source always go to review.
    embeddings:
      enabled: false
      # ONNX model file (f.ex. exported with tools/export_sscd_onnx.py). If not set, the model is
      # downloaded from model_url (or a pinned ONNX export of SSCD disc_mixup) into cache_directory.
      # model_path: /data/models/sscd_disc_mixup.onnx
      # model_url: https://example.com/sscd_disc_mixup.onnx
      # SHA-256 of the model file (required with model_url, verified before loading)
      # model_sha256: e65e2a5b9a5e44a0b0f011bddaa6f28621021f6120ca7ce8b526c19f2f6156f8
      # Downloaded model and embedding cache (embeddings.db), default: "embeddings" next to
      # state.database_path
      # cache_directory: /data/state/embeddings
      # Minimum cosine similarity of two embeddings to be considered a crop/copy
      similarity_threshold: 0.6

  # Prometheus exporter specific configuration options, see README.md
  stats:
    # Whether to enable prometheus statistics or not.
    enabled: true
    # The port to expose statistics on.
    port: 8000

  # State of the daemon shown in the web UI, see README.md
  state:
    # Path of the SQLite database holding runs, duplicate groups, decisions and
    # the action log. Thumbnails are cached next to it.
    database_path: ~/.local/share/py-image-dedup/state.db

  # Web UI of the daemon, see README.md
  web:
    # Whether to start the web UI (and its JSON API) when running the daemon.
    enabled: true
    # The address the web UI listens on. The web UI has no authentication,
    # only expose it to trusted networks.
    host: 127.0.0.1
    # The port the web UI listens on.
    port: 8080
    # Directory containing the built web UI (web/dist). If unset, web/dist
    # next to the py_image_dedup package is used, if it exists.
    # static_directory: /app/web/dist

  # Optional Immich integration: import the files trashed in Immich (f.ex. by
  # its duplicate review) as decisions for the duplicate groups (web UI dashboard),
  # "open in Immich" links in the group detail and library rescans after changes.
  immich:
    # Base URL of the Immich server.
    # url: http://immich-server:2283
    # API key with the asset.read permission of the user who owns the trashed
    # assets. Better set via env: PY_IMAGE_DEDUP_IMMICH_API_KEY
    # api_key: ...
    # URL of Immich as reachable from the browser, for the "open in Immich" links
    # in the web UI. Falls back to url.
    # public_url: https://immich.example.com
    # Queue a scan of the Immich external libraries after files were really
    # moved or deleted (at most once per run / batch of executed decisions).
    # Needs an API key of an Immich admin with the library.read and
    # library.update permissions.
    rescan_after_changes: false
    # Maps the paths Immich reports to the paths this application sees,
    # f.ex. when Immich mounts the library at a different location.
    # Only paths matching a mapping are imported (if any mapping is set).
    path_mappings: []
    #  - immich: /mnt/photos
    #    local: /data/photos
