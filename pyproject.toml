[project]
name = "py-image-dedup"
version = "2.0.1"
description = "A library to find duplicate images and delete unwanted ones"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Markus Ressel", email = "mail@markusressel.de" },
]
readme = "README.md"
keywords = ['deduplication', 'py-image-dedup']
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable"
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "Pillow",
    "ordered-set",
    "watchdog>=0.10.2,<6.1.0",
    "elasticsearch>=7,<8",
    "scipy",
    "numpy",
    "container-app-conf>=5.0.0,<6.0.0",
    "requests>=2.20.0,<3.0.0",
    "click",
    "tabulate>=0.8.3,<0.11.0",
    "tqdm",
    "prometheus-client",
    # fork of the unmaintained upstream, see AGENTS.md
    "image-match @ git+https://github.com/markusressel/image-match.git@3.0.0",
    "ruamel-yaml-clib>=0.2.15",
    "fastapi>=0.162.0,<0.163.0",
    "uvicorn>=0.54.0,<0.55.0",
    "imagehash>=4.3.2,<5.0.0",
]

[project.optional-dependencies]
# PostgreSQL signature store of the experimental matching pipeline (py_image_dedup/matching/store_postgres.py)
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]
# opt-in crop detection of the experimental matching pipeline (py_image_dedup/matching/embeddings.py)
embeddings = [
    "onnxruntime>=1.23.0,<2.0.0",
]

[project.urls]
homepage = "https://github.com/markusressel/py-image-dedup"
repository = "https://github.com/markusressel/py-image-dedup"

[project.scripts]
py-image-dedup = 'py_image_dedup.cli:cli'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "*"
httpx2 = "^2.16.0"
