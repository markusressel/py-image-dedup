name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry==2.3.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run unit tests
        run: poetry run pytest

  web-ui:
    name: Web UI (lint, type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  integration-tests:
    name: Integration tests (Elasticsearch ${{ matrix.elasticsearch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # image-match and the elasticsearch client only work with Elasticsearch 7.x
        elasticsearch: [ "7.9.2", "7.17.28" ]
    services:
      elasticsearch:
        image: elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      # signature store of the experimental matching pipeline (tests/test_matching_store.py)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PY_IMAGE_DEDUP_ELASTICSEARCH_HOST: 127.0.0.1
      PY_IMAGE_DEDUP_ELASTICSEARCH_PORT: 9200
      PY_IMAGE_DEDUP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install poetry
        run: pipx install poetry==2.3.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction --extras postgres
      # ElasticSearchStoreBackend retries forever until Elasticsearch answers, so make sure it is up first
      - name: Wait for Elasticsearch
        run: |
          timeout 180 bash -c 'until curl -fs "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"; do sleep 5; done'
          curl -fs http://127.0.0.1:9200
      - name: Run integration tests
        run: timeout 600 poetry run pytest -m integration
