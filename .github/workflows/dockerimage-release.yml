name: Docker Image Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # QEMU emulates linux/arm64, only the Python stage runs emulated (all wheels are prebuilt for arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to DockerHub Registry
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push the Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # on a tag push, ref_name is the tag name
          tags: markusressel/py-image-dedup:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
